services:
  - type: web
    name: anomaly-moex-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /live
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: SUBSCRIPTION_PRICE_STARS
        value: "250"
      - key: POLL_INTERVAL_SEC
        value: "60"
      - key: MOEX_ISS_BASE
        value: "http://iss.moex.com/iss"
      - key: DB_PATH
        value: "data/bot.db"
      - key: LOG_FILE
        value: "logs/bot.log"
      - key: VOLUME_SPIKE_MULTIPLIER
        value: "3.0"
      - key: PRICE_CHANGE_THRESHOLD_PCT
        value: "3.0"
      - key: VOLATILITY_SIGMA
        value: "2.5"
      - key: MIN_SIGNAL_VALUE_RUB
        value: "250000"
