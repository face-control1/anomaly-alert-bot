services:
  - type: web
    name: anomaly-alert-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: SUBSCRIPTION_PRICE_STARS
        value: "250"
      - key: POLL_INTERVAL_SEC
        value: "60"
      - key: DB_PATH
        value: "data/bot.db"
      - key: LOG_FILE
        value: "logs/bot.log"
      - key: VOLUME_SPIKE_MULTIPLIER
        value: "3.0"
      - key: PRICE_CHANGE_THRESHOLD_PCT
        value: "3.0"
      - key: VOLATILITY_SIGMA
        value: "2.5"
