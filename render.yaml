services:
  - type: web
    name: anomaly-alert-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: SUBSCRIPTION_PRICE_STARS
        value: "250"
      - key: POLL_INTERVAL_SEC
        value: "60"
      - key: DB_PATH
        value: "data/bot.db"
      - key: LOG_FILE
        value: "logs/bot.log"
