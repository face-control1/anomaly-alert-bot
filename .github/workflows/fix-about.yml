name: Fix About Handler
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add cb_about handler
        run: |
          python3 << 'PYEOF'
          import re, sys
          with open("bot/handlers.py", "r", encoding="utf-8") as f:
              content = f.read()
          if "cb_about" in content:
              print("already exists"); sys.exit(0)
          new_h = '''@router.callback_query(F.data == "about")
          async def cb_about(cb: CallbackQuery) -> None:
              try:
                  await cb.message.edit_text(
                      "\u2139\ufe0f <b>\u041e \u0431\u043e\u0442\u0435 MoexHelp</b>\n\n"
                      "\u0411\u043e\u0442 \u043a\u0430\u0436\u0434\u0443\u044e \u043c\u0438\u043d\u0443\u0442\u0443 \u0441\u043a\u0430\u043d\u0438\u0440\u0443\u0435\u0442 \u0440\u044b\u043d\u043e\u043a \u0438 \u043f\u0440\u0438\u0441\u044b\u043b\u0430\u0435\u0442 \u0430\u043b\u0435\u0440\u0442\u044b:\n\n"
                      "\U0001f50a <b>\u0410\u043d\u043e\u043c\u0430\u043b\u044c\u043d\u044b\u0439 \u043e\u0431\u044a\u0451\u043c</b> \u2014 \u043e\u0431\u044a\u0451\u043c \u0442\u043e\u0440\u0433\u043e\u0432 \u043f\u0440\u0435\u0432\u044b\u0448\u0430\u0435\u0442 \u0441\u0440\u0435\u0434\u043d\u0435\u0435 \u0432 3\u00d7 \u0438 \u0431\u043e\u043b\u0435\u0435\n"
                      "\U0001f6a8 <b>\u0420\u0435\u0437\u043a\u043e\u0435 \u0434\u0432\u0438\u0436\u0435\u043d\u0438\u0435</b> \u2014 \u0446\u0435\u043d\u0430 \u0438\u0437\u043c\u0435\u043d\u0438\u043b\u0430\u0441\u044c \u0431\u043e\u043b\u0435\u0435 \u0447\u0435\u043c \u043d\u0430 3% \u0437\u0430 \u043c\u0438\u043d\u0443\u0442\u0443\n"
                      "\U0001f4c8\U0001f4c9 <b>\u041f\u043e\u043b\u043e\u0441\u044b \u0411\u043e\u043b\u043b\u0438\u043d\u0434\u0436\u0435\u0440\u0430</b> \u2014 \u0446\u0435\u043d\u0430 \u0432\u044b\u0448\u043b\u0430 \u0437\u0430 2.5\u03c3 \u043e\u0442 \u0441\u043a\u043e\u043b\u044c\u0437\u044f\u0449\u0435\u0439 \u0441\u0440\u0435\u0434\u043d\u0435\u0439\n\n"
                      "\u041c\u043e\u043d\u0438\u0442\u043e\u0440\u0438\u043d\u0433: \u0432\u0441\u0435 \u0430\u043a\u0446\u0438\u0438 \u041c\u041c\u0412\u0411 + \u0432\u0430\u0448\u0438 \u043f\u0435\u0440\u0441\u043e\u043d\u0430\u043b\u044c\u043d\u044b\u0435 \u0442\u0438\u043a\u0435\u0440\u044b.\n\n"
                      "\U0001f4b0 \u0421\u0442\u043e\u0438\u043c\u043e\u0441\u0442\u044c: <b>250 \u2b50 Stars / \u043c\u0435\u0441\u044f\u0446</b>\n"
                      "\U0001f381 \u041f\u0440\u043e\u0431\u043d\u044b\u0439 \u043f\u0435\u0440\u0438\u043e\u0434: <b>24 \u0447\u0430\u0441\u0430 \u0431\u0435\u0441\u043f\u043b\u0430\u0442\u043d\u043e</b>",
                      reply_markup=back_kb(), parse_mode="HTML",
                  )
              except Exception: pass
              await cb.answer()
          '''
          pos = content.find('@router.callback_query(F.data == "status")')
          if pos == -1: print("ERROR: no status handler"); sys.exit(1)
          with open("bot/handlers.py", "w", encoding="utf-8") as f:
              f.write(content[:pos] + new_h + "\n\n\n" + content[pos:])
          print("Done")
          PYEOF
      - name: Commit
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add bot/handlers.py
          git commit -m "fix: add cb_about handler" || echo "nothing to commit"
          git push
